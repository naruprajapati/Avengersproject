<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avenger</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            background: #e62429;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        .hero {
            padding: 80px 20px;
        }

        .hero h2 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            color: #ccc;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #e62429;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        footer {
            margin-top: 80px;
            padding: 20px;
            background: #222;
            color: #aaa;
        }
    </style>
</head>

<body>

    <header>
        <h1>AVENGERS</h1>
    </header>

    <section class="hero">
        <h2>Welcome to Avengers</h2>

        <p>
            Earth's Mightiest Heroes are ready for action.
        </p>

        <a href="#" class="button">Assemble</a>
    </section>

    <footer>
        <p>© 2026 Avengers Project</p>
    </footer>

</body>
</html>
